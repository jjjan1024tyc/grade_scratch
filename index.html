<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch評量工具</title>
    
    <!-- 引入 Tailwind CSS 框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        window.scriptLoadErrors = [];
        function handleScriptError(script) {
            const src = script.src;
            const name = src.split('/').pop(); 
            console.error(`[關鍵錯誤] Script load failed: ${src}`);
            const logDiv = document.getElementById('consoleLog');
            if (logDiv) {
                const entry = document.createElement('div');
                entry.className = `log-entry text-red-400`;
                entry.innerText = `[系統錯誤] 無法載入關鍵核心: ${name}，請檢查網路狀態。`;
                logDiv.appendChild(entry);
            }
        }
    </script>

    <!-- 引入 Scratch 虛擬機與必要套件 (完全移除音效套件，避免 HTTPS 下的死鎖) -->
    <script src="https://cdn.jsdelivr.net/npm/scratch-vm/dist/web/scratch-vm.min.js" crossorigin="anonymous" onerror="handleScriptError(this)"></script>
    <script src="https://cdn.jsdelivr.net/npm/scratch-storage/dist/web/scratch-storage.min.js" crossorigin="anonymous" onerror="handleScriptError(this)"></script>
    <script src="https://cdn.jsdelivr.net/npm/scratch-svg-renderer/dist/web/scratch-svg-renderer.js" crossorigin="anonymous" onerror="handleScriptError(this)"></script>
    <script src="https://cdn.jsdelivr.net/npm/scratch-render/dist/web/scratch-render.min.js" crossorigin="anonymous" onerror="handleScriptError(this)"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        body { font-family: 'Noto Sans TC', 'Inter', sans-serif; background-color: #f8fafc; }
        .log-entry { font-family: 'Courier New', Courier, monospace; font-size: 0.8rem; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        /* 統一加大的輸入框樣式 */
        .custom-input { width: 100%; min-width: 0; padding: 6px 8px; text-align: center; border: 1px solid #d1d5db; border-radius: 6px; outline: none; transition: all 0.2s; font-family: inherit; font-size: 18px; }
        .custom-input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .var-input { width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; outline: none; font-size: 18px; }
        .var-input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2); }
        
        /* 鎖定狀態隱藏外觀 */
        .custom-input:disabled { background-color: transparent !important; border-color: transparent; box-shadow: none; cursor: default; }
        .var-input:disabled, .mode-select:disabled { background-color: transparent !important; color: #475569; border-color: transparent; box-shadow: none; cursor: default; appearance: none; -webkit-appearance: none; padding-left: 0;}
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-screen flex flex-col xl:flex-row overflow-hidden text-slate-800">

    <!-- 左側面板：變數設定區 -->
    <div class="w-full xl:w-3/12 bg-white p-6 shadow-xl overflow-y-auto flex flex-col gap-6 z-10 border-r border-slate-200">
        <div class="border-b pb-4 flex flex-col gap-3">
            <div class="flex items-center">
                <h1 class="text-[22px] font-bold text-slate-800 flex items-center">
                    <i class="fa-solid fa-microchip mr-2 text-indigo-500"></i>Scratch評量工具
                </h1>
                <button onclick="handleManageClick()" id="manageBtn" class="ml-3 bg-slate-500 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg text-[18px] transition font-medium flex justify-center items-center gap-2 shadow-sm whitespace-nowrap">
                    <i class="fa-solid fa-gear"></i> <span>管理</span>
                </button>
            </div>
            <div class="flex justify-between items-center">
                <p class="text-[18px] text-slate-500">先載入Scratch專案，再開始自動評分</p>
                <button onclick="shareLink()" id="shareBtn" class="hidden bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg text-[18px] transition font-medium flex justify-center items-center gap-2 shadow-sm whitespace-nowrap">
                    <i class="fa-solid fa-link"></i> <span>複製連結</span>
                </button>
            </div>
        </div>

        <div class="space-y-4 bg-violet-50 p-4 rounded-lg border border-violet-200">
            <div class="flex justify-between items-center mb-2">
                <label class="block text-[18px] font-bold text-violet-900">設定Scratch變數名稱</label>
            </div>
            
            <div class="flex flex-col gap-4">
                <!-- 輸入變數 -->
                <div class="bg-white p-3 rounded border border-violet-100 shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[18px] font-bold text-slate-700">Scratch 輸入變數</span>
                        <select id="inputCount" onchange="updateConfigUI()" class="text-[18px] border border-slate-300 rounded p-1 bg-slate-50 outline-none focus:border-indigo-500">
                            <option value="1">1 個輸入</option>
                            <option value="2" selected>2 個輸入</option>
                            <option value="3">3 個輸入</option>
                            <option value="4">4 個輸入</option>
                        </select>
                    </div>
                    <div id="inputConfigContainer" class="flex flex-col gap-2"></div>
                </div>

                <!-- 輸出變數 -->
                <div class="bg-white p-3 rounded border border-violet-100 shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[18px] font-bold text-slate-700">Scratch 輸出變數</span>
                        <select id="outputCount" onchange="updateConfigUI()" class="text-[18px] border border-slate-300 rounded p-1 bg-slate-50 outline-none focus:border-indigo-500">
                            <option value="1">1 個輸出</option>
                            <option value="2" selected>2 個輸出</option>
                            <option value="3">3 個輸出</option>
                            <option value="4">4 個輸出</option>
                        </select>
                    </div>
                    <div id="outputConfigContainer" class="flex flex-col gap-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 右側面板：表格與顯示區 -->
    <div class="w-full xl:w-9/12 bg-slate-100 flex flex-col h-full overflow-hidden relative">
        <div class="bg-white p-4 border-b border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 z-20 shadow-sm">
            <div class="flex items-center gap-2 w-full md:w-auto overflow-hidden">
                <label class="text-[18px] font-bold text-slate-700 whitespace-nowrap"><i class="fa-solid fa-cloud-arrow-down text-slate-400 mr-1"></i> 載入Scratch專案</label>
                <input type="text" id="projectUrl" placeholder="例如: 1263904376" class="w-48 p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 focus:outline-none text-[18px] font-mono" value="1263904376">
                <button onclick="loadProject()" id="loadBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-[18px] transition font-medium flex items-center gap-2 whitespace-nowrap">
                    <span>載入</span>
                </button>
                <span id="projectTitle" class="text-[18px] text-slate-600 font-medium truncate flex-1 ml-2"></span>
            </div>
            
            <div class="w-full md:w-auto flex gap-2">
                <button onclick="runBatchTest()" id="runBtn" disabled class="w-full bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold py-2 px-6 rounded-lg shadow-md transition flex justify-center items-center gap-2 text-[18px] whitespace-nowrap">
                    <i class="fa-solid fa-play"></i> 開始自動評分
                </button>
            </div>
        </div>

        <div class="flex-1 p-6 overflow-y-auto bg-white border-b border-slate-200 relative">
            <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
                <i class="fa-solid fa-table-list text-indigo-500 mr-2"></i>自動評測資料集與結果
            </h2>

            <div class="rounded-lg border border-slate-300 shadow-sm overflow-hidden">
                <table class="w-full text-[18px] border-collapse table-fixed">
                    <thead id="tableHeader"></thead>
                    <tbody id="testDataBody" class="bg-white"></tbody>
                </table>
            </div>
            
            <div id="gradingSummary" class="hidden mt-4 p-5 bg-indigo-50 border border-indigo-200 rounded-lg flex justify-between items-center shadow-sm">
                <div class="text-slate-700 font-bold text-[18px]" id="gradingTime"></div>
                <div class="text-[28px] font-bold text-indigo-900" id="gradingTotalScore"></div>
            </div>
        </div>

        <!-- 虛擬機顯示與控制台日誌 -->
        <div class="h-56 bg-slate-900 flex flex-col flex-none relative">
            <div class="absolute right-0 top-0 opacity-[0.02] pointer-events-none transform scale-50 origin-top-right overflow-hidden border border-white">
                <canvas id="scratch-stage" width="480" height="360" class="bg-white"></canvas>
            </div>
            <div class="flex-1 p-3 overflow-y-auto font-mono text-[11px] z-10" id="consoleLog">
                <div class="text-emerald-400 border-b border-slate-700 pb-1 mb-1 font-bold">>>> 系統日誌與執行狀態</div>
                <div class="text-slate-400">系統準備就緒...</div>
            </div>
            <div class="bg-slate-950 text-slate-500 text-[10px] p-1.5 px-3 flex justify-between items-center border-t border-slate-800 z-10">
                <div id="statusText">等待指令</div>
                <div class="text-slate-600"><i class="fa-solid fa-circle text-[8px] text-emerald-500 mr-1"></i>VM Ready</div>
            </div>
        </div>
    </div>

    <!-- 密碼驗證對話框 -->
    <div id="verifyDialog" class="fixed inset-0 bg-slate-900/40 hidden flex items-center justify-center z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-80 border border-slate-200">
            <h3 class="text-lg font-bold text-slate-700 mb-2 flex items-center"><i class="fa-solid fa-lock text-slate-400 mr-2"></i>解鎖設定面板</h3>
            <p class="text-xs text-slate-500 mb-4">請輸入密碼以編輯變數名稱與標準答案。</p>
            <input type="password" id="verifyInput" class="w-full p-2 border border-slate-300 rounded-lg mb-5 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-[16px]" placeholder="請輸入密碼..." onkeypress="if(event.key === 'Enter') verifyAndUnlock()">
            <div id="verifyError" class="text-xs text-red-500 hidden mb-3 font-bold">密碼錯誤，請重試。</div>
            <div class="flex justify-end gap-2">
                <button onclick="closeVerifyDialog()" class="px-4 py-2 text-sm font-bold text-slate-500 hover:bg-slate-100 rounded-lg transition">取消</button>
                <button onclick="verifyAndUnlock()" class="px-4 py-2 text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition shadow-sm">確認解鎖</button>
            </div>
        </div>
    </div>

    <!-- 複製連結對話框 (解決 Canvas 阻擋複製的問題) -->
    <div id="shareDialog" class="fixed inset-0 bg-slate-900/40 hidden flex items-center justify-center z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-[90%] max-w-2xl border border-slate-200">
            <h3 class="text-[20px] font-bold text-slate-700 mb-2 flex items-center"><i class="fa-solid fa-link text-blue-500 mr-2"></i>取得專屬測驗連結</h3>
            <p class="text-[16px] text-slate-500 mb-4">若在教學平台中無法自動複製，請手動複製下方網址，並提供給學生：</p>
            <div class="flex gap-2 mb-2">
                <input type="text" id="shareUrlInput" class="w-full p-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-[16px] font-mono text-slate-600 bg-slate-50" readonly>
                <button onclick="manualCopy()" id="manualCopyBtn" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition shadow-sm font-bold text-[18px] whitespace-nowrap">複製</button>
            </div>
            <div class="flex justify-end mt-5">
                <button onclick="closeShareDialog()" class="px-6 py-2 text-[18px] font-bold bg-slate-500 hover:bg-slate-600 text-white rounded-lg transition shadow-sm">關閉</button>
            </div>
        </div>
    </div>

    <script>
        // 系統變數
        let vm;
        let renderer;
        let storage;
        let isProjectLoaded = false;
        let isRunningTest = false;
        window.testInputQueue = []; 
        let isConfigLocked = true; // 預設鎖定狀態
        
        // 預設測驗資料
        const defaultMockData = [
            { in: ["170", "40"], out: ["13.8", "過輕"] },
            { in: ["100", "15.2"], out: ["15.2", "正常"] },
            { in: ["170", "50"], out: ["17.3", "正常"] },
            { in: ["100", "21.3"], out: ["21.3", "過重"] },
            { in: ["170", "70"], out: ["24.2", "過重"] }
        ];
        
        let currentConfig = {
            inputs: [{ name: '身高(cm)', type: 'input' }, { name: '體重(kg)', type: 'input' }],
            outputs: [{ name: 'BMI值', type: 'output', mode: 'round1' }, { name: '體位', type: 'output', mode: 'text' }]
        };

        // 初始化
        window.onload = function() {
            loadConfigFromUrl();
            updateConfigUI();
            applyLockState();
            setTimeout(initVM, 300); 
        };

        // 從網址載入專屬設定
        function loadConfigFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const configStr = params.get('config');
            if (configStr) {
                try {
                    const data = JSON.parse(decodeURIComponent(atob(configStr)));
                    if (data.p) document.getElementById('projectUrl').value = data.p;
                    document.getElementById('inputCount').value = data.ic;
                    document.getElementById('outputCount').value = data.oc;
                    window.importedConfig = data;
                    defaultMockData.length = 0; 
                    data.r.forEach(row => defaultMockData.push(row));
                    log('已成功載入專屬測驗設定！', 'success');
                } catch(e) {
                    console.error("設定載入失敗", e);
                    log('專屬連結無效或已損毀，套用預設值。', 'warn');
                }
            }
        }

        // 處理管理鎖定按鈕
        function handleManageClick() {
            if (isConfigLocked) {
                document.getElementById('verifyInput').value = '';
                document.getElementById('verifyError').classList.add('hidden');
                document.getElementById('verifyDialog').classList.remove('hidden');
                setTimeout(() => document.getElementById('verifyInput').focus(), 100);
            } else {
                isConfigLocked = true;
                applyLockState();
                log('已鎖定設定面板。', 'info');
            }
        }

        function closeVerifyDialog() { document.getElementById('verifyDialog').classList.add('hidden'); }
        function closeShareDialog() { document.getElementById('shareDialog').classList.add('hidden'); }

        // 密碼驗證
        function verifyAndUnlock() {
            const val = document.getElementById('verifyInput').value;
            // 'ampqYW4=' 是 'jjjan' 的 Base64 編碼
            if (btoa(val) === 'ampqYW4=') {
                isConfigLocked = false;
                closeVerifyDialog();
                applyLockState();
                log('密碼驗證通過，已開放編輯設定。', 'success');
            } else {
                document.getElementById('verifyError').classList.remove('hidden');
                document.getElementById('verifyInput').value = '';
                document.getElementById('verifyInput').focus();
            }
        }

        // 產生並分享專屬連結
        function shareLink() {
            const pid = document.getElementById('projectUrl').value;
            const inCount = parseInt(document.getElementById('inputCount').value);
            const outCount = parseInt(document.getElementById('outputCount').value);
            
            const inputs = [];
            for (let i = 0; i < inCount; i++) inputs.push(document.getElementById(`cfgIn_${i}`).value);
            
            const outputs = [];
            for (let i = 0; i < outCount; i++) {
                outputs.push({ n: document.getElementById(`cfgOut_${i}`).value, m: document.getElementById(`cfgMode_${i}`).value });
            }
            
            const rows = [];
            document.querySelectorAll('#testDataBody tr').forEach(row => {
                const inVals = Array.from(row.querySelectorAll('input[data-type="in"]')).map(el => el.value);
                const outVals = Array.from(row.querySelectorAll('input[data-type="out"]')).map(el => el.value);
                rows.push({ in: inVals, out: outVals });
            });

            // 打包成 JSON
            const data = { p: pid, ic: inCount, oc: outCount, in: inputs, out: outputs, r: rows };
            const base64Str = btoa(encodeURIComponent(JSON.stringify(data)));
            
            // 建立含參數網址
            const urlObj = new URL(window.location.href);
            urlObj.searchParams.set('config', base64Str);
            const shareUrl = urlObj.toString();
            
            // 嘗試自動複製
            try {
                const tempInput = document.createElement("textarea");
                tempInput.value = shareUrl;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
            } catch(e) {}
            
            // 彈出視窗提供手動複製
            document.getElementById('shareUrlInput').value = shareUrl;
            document.getElementById('shareDialog').classList.remove('hidden');
            
            const mBtn = document.getElementById('manualCopyBtn');
            mBtn.innerText = '複製';
            mBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
            mBtn.classList.replace('hover:bg-emerald-700', 'hover:bg-blue-700');

            setTimeout(() => document.getElementById('shareUrlInput').select(), 100);
            log('已產生專屬測驗連結。', 'success');
        }

        function manualCopy() {
            const copyText = document.getElementById('shareUrlInput');
            copyText.select();
            copyText.setSelectionRange(0, 99999); 
            try {
                document.execCommand("copy");
                const mBtn = document.getElementById('manualCopyBtn');
                mBtn.innerText = '已複製!';
                mBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
                mBtn.classList.replace('hover:bg-blue-700', 'hover:bg-emerald-700');
            } catch(err) { console.error("手動複製失敗", err); }
        }

        // 套用介面鎖定/解鎖外觀
        function applyLockState() {
            const btn = document.getElementById('manageBtn');
            const shareBtn = document.getElementById('shareBtn');
            if (isConfigLocked) {
                btn.innerHTML = '<i class="fa-solid fa-gear"></i> <span>管理</span>';
                btn.className = "ml-3 bg-slate-500 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg text-[18px] transition font-medium flex justify-center items-center gap-2 shadow-sm whitespace-nowrap";
                if(shareBtn) shareBtn.classList.add('hidden');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-lock"></i> <span>確定</span>';
                btn.className = "ml-3 bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-[18px] transition font-medium flex justify-center items-center gap-2 shadow-sm whitespace-nowrap";
                if(shareBtn) shareBtn.classList.remove('hidden');
            }

            document.getElementById('inputCount').disabled = isConfigLocked;
            document.getElementById('outputCount').disabled = isConfigLocked;

            document.querySelectorAll('#inputConfigContainer input, #outputConfigContainer input, #outputConfigContainer select, #testDataBody input').forEach(el => el.disabled = isConfigLocked);
            document.querySelectorAll('.delete-btn').forEach(btn => isConfigLocked ? btn.classList.add('hidden') : btn.classList.remove('hidden'));
        }

        // 更新左側設定介面
        function updateConfigUI() {
            const inCount = parseInt(document.getElementById('inputCount').value);
            const outCount = parseInt(document.getElementById('outputCount').value);
            const inContainer = document.getElementById('inputConfigContainer');
            const outContainer = document.getElementById('outputConfigContainer');
            
            const oldInputs = [];
            const oldOutputs = [];
            
            if (window.importedConfig) {
                window.importedConfig.in.forEach(n => oldInputs.push(n));
                window.importedConfig.out.forEach(o => oldOutputs.push({ name: o.n, mode: o.m }));
                window.importedConfig = null; 
            } else {
                Array.from(inContainer.querySelectorAll('input.var-input')).forEach(el => oldInputs.push(el.value));
                outContainer.querySelectorAll('.output-row').forEach(row => {
                    oldOutputs.push({ name: row.querySelector('.var-input').value, mode: row.querySelector('.mode-select').value });
                });
            }

            inContainer.innerHTML = '';
            for (let i = 0; i < inCount; i++) {
                const defaultVal = oldInputs[i] || (i === 0 ? '身高(cm)' : i === 1 ? '體重(kg)' : `輸入變數${i+1}`);
                inContainer.innerHTML += `
                    <div class="flex gap-2 items-center input-row">
                        <input type="text" id="cfgIn_${i}" value="${defaultVal}" onchange="generateTable()" class="var-input flex-1 text-[18px]" placeholder="Scratch 變數名稱">
                        <button onclick="removeInput(${i})" class="delete-btn text-slate-400 hover:text-red-500 transition px-2 text-[18px]"><i class="fa-solid fa-trash-can"></i></button>
                    </div>`;
            }

            outContainer.innerHTML = '';
            for (let i = 0; i < outCount; i++) {
                const oldObj = oldOutputs[i] || {};
                const defaultVal = oldObj.name || (i === 0 ? 'BMI值' : i === 1 ? '體位' : `輸出變數${i+1}`);
                const defaultMode = oldObj.mode || (i === 0 ? 'round1' : 'text'); 
                
                outContainer.innerHTML += `
                    <div class="flex gap-2 items-center output-row">
                        <input type="text" id="cfgOut_${i}" value="${defaultVal}" onchange="generateTable()" class="var-input flex-1 text-[18px]" placeholder="變數名稱">
                        <select id="cfgMode_${i}" onchange="generateTable()" class="mode-select text-[18px] border border-slate-300 rounded p-1 bg-white outline-none text-slate-600 flex-none">
                            <option value="text" ${defaultMode === 'text' ? 'selected' : ''}>文字 (純文字)</option>
                            <option value="round0" ${defaultMode === 'round0' ? 'selected' : ''}>四捨五入 (整數)</option>
                            <option value="round1" ${defaultMode === 'round1' ? 'selected' : ''}>四捨五入 (小數 1 位)</option>
                            <option value="round2" ${defaultMode === 'round2' ? 'selected' : ''}>四捨五入 (小數 2 位)</option>
                        </select>
                        <button onclick="removeOutput(${i})" class="delete-btn text-slate-400 hover:text-red-500 transition px-2 text-[18px]"><i class="fa-solid fa-trash-can"></i></button>
                    </div>`;
            }
            applyLockState(); 
            generateTable(); 
        }

        function removeInput(index) {
            if (isConfigLocked) return;
            const select = document.getElementById('inputCount');
            let count = parseInt(select.value);
            if (count <= 1) { log('至少需保留一個輸入變數', 'warn'); return; }
            const inContainer = document.getElementById('inputConfigContainer');
            const oldInputs = Array.from(inContainer.querySelectorAll('input.var-input')).map(el => el.value);
            oldInputs.splice(index, 1);
            select.value = count - 1;
            inContainer.innerHTML = '';
            for (let i = 0; i < count - 1; i++) {
                inContainer.innerHTML += `
                    <div class="flex gap-2 items-center input-row">
                        <input type="text" id="cfgIn_${i}" value="${oldInputs[i] || `輸入變數${i+1}`}" onchange="generateTable()" class="var-input flex-1 text-[18px]">
                        <button onclick="removeInput(${i})" class="delete-btn text-slate-400 hover:text-red-500 transition px-2 text-[18px]"><i class="fa-solid fa-trash-can"></i></button>
                    </div>`;
            }
            applyLockState();
            generateTable();
        }

        function removeOutput(index) {
            if (isConfigLocked) return;
            const select = document.getElementById('outputCount');
            let count = parseInt(select.value);
            if (count <= 1) { log('至少需保留一個預期輸出', 'warn'); return; }
            const outContainer = document.getElementById('outputConfigContainer');
            const oldOutputs = [];
            outContainer.querySelectorAll('.output-row').forEach(row => {
                oldOutputs.push({ name: row.querySelector('.var-input').value, mode: row.querySelector('.mode-select').value });
            });
            oldOutputs.splice(index, 1);
            select.value = count - 1;
            outContainer.innerHTML = '';
            for (let i = 0; i < count - 1; i++) {
                const defaultMode = (oldOutputs[i] && oldOutputs[i].mode) ? oldOutputs[i].mode : 'text';
                outContainer.innerHTML += `
                    <div class="flex gap-2 items-center output-row">
                        <input type="text" id="cfgOut_${i}" value="${(oldOutputs[i] && oldOutputs[i].name) || `輸出變數${i+1}`}" onchange="generateTable()" class="var-input flex-1 text-[18px]">
                        <select id="cfgMode_${i}" onchange="generateTable()" class="mode-select text-[18px] border border-slate-300 rounded p-1 bg-white outline-none text-slate-600 flex-none">
                            <option value="text" ${defaultMode === 'text' ? 'selected' : ''}>文字 (純文字)</option>
                            <option value="round0" ${defaultMode === 'round0' ? 'selected' : ''}>四捨五入 (整數)</option>
                            <option value="round1" ${defaultMode === 'round1' ? 'selected' : ''}>四捨五入 (小數 1 位)</option>
                            <option value="round2" ${defaultMode === 'round2' ? 'selected' : ''}>四捨五入 (小數 2 位)</option>
                        </select>
                        <button onclick="removeOutput(${i})" class="delete-btn text-slate-400 hover:text-red-500 transition px-2 text-[18px]"><i class="fa-solid fa-trash-can"></i></button>
                    </div>`;
            }
            applyLockState();
            generateTable();
        }

        function generateTable() {
            const inCount = parseInt(document.getElementById('inputCount').value);
            const outCount = parseInt(document.getElementById('outputCount').value);
            
            currentConfig.inputs = [];
            currentConfig.outputs = [];
            for (let i = 0; i < inCount; i++) currentConfig.inputs.push({ name: document.getElementById(`cfgIn_${i}`).value || `未命名入${i+1}`, type: 'input' });
            for (let i = 0; i < outCount; i++) currentConfig.outputs.push({ name: document.getElementById(`cfgOut_${i}`).value || `未命名出${i+1}`, type: 'output', mode: document.getElementById(`cfgMode_${i}`).value });

            const thead = document.getElementById('tableHeader');
            let tr1 = `<tr>
                <th rowspan="2" class="border border-slate-300 p-2 bg-slate-200 text-slate-600 w-12 text-center">#</th>
                <th colspan="${currentConfig.inputs.length}" class="border border-slate-300 p-2 text-center text-blue-800 bg-blue-100 font-bold whitespace-nowrap">1. 測試資料(輸入)</th>
                <th colspan="${currentConfig.outputs.length}" class="border border-slate-300 p-2 text-center text-green-800 bg-green-100 font-bold whitespace-nowrap">2. 標準答案(輸出)</th>
                <th colspan="${currentConfig.outputs.length}" class="border border-slate-300 p-2 text-center text-purple-800 bg-purple-100 font-bold whitespace-nowrap">3. Scratch 執行結果(輸出)</th>
                <th rowspan="2" class="border border-slate-300 p-2 bg-slate-200 text-slate-600 font-bold w-24 text-center">評分</th>
            </tr>`;
            
            let tr2 = `<tr class="text-[18px]">`;
            currentConfig.inputs.forEach(cfg => tr2 += `<th class="border border-slate-300 p-1 text-center bg-blue-50 text-slate-700">${cfg.name}</th>`);
            currentConfig.outputs.forEach(cfg => tr2 += `<th class="border border-slate-300 p-1 text-center bg-green-50 text-slate-700">${cfg.name}</th>`);
            currentConfig.outputs.forEach(cfg => tr2 += `<th class="border border-slate-300 p-1 text-center bg-purple-50 text-slate-700">${cfg.name}</th>`);
            tr2 += `</tr>`;
            thead.innerHTML = tr1 + tr2;

            const existingRows = document.querySelectorAll('#testDataBody tr');
            const savedData = [];
            existingRows.forEach(row => {
                savedData.push({ 
                    in: Array.from(row.querySelectorAll('input[data-type="in"]')).map(el => el.value), 
                    out: Array.from(row.querySelectorAll('input[data-type="out"]')).map(el => el.value) 
                });
            });

            const tbody = document.getElementById('testDataBody');
            tbody.innerHTML = '';
            for (let r = 0; r < 5; r++) {
                const tr = document.createElement('tr');
                tr.className = r % 2 !== 0 ? 'bg-slate-50 border-b border-slate-200 hover:bg-indigo-50/50 transition-colors' : 'bg-white border-b border-slate-200 hover:bg-indigo-50/50 transition-colors';
                
                let tdHtml = `<td class="border-r border-slate-200 p-2 text-center text-slate-500 font-medium">${r+1}</td>`;
                currentConfig.inputs.forEach((cfg, idx) => {
                    let val = (savedData[r] && savedData[r].in[idx] !== undefined) ? savedData[r].in[idx] : ((defaultMockData[r] && defaultMockData[r].in[idx] !== undefined) ? defaultMockData[r].in[idx] : "0");
                    tdHtml += `<td class="border-r border-slate-200 p-1"><input type="text" data-type="in" data-idx="${idx}" value="${val}" class="custom-input font-mono text-blue-700 font-bold bg-blue-50/20" onchange="generateTable()"></td>`;
                });
                currentConfig.outputs.forEach((cfg, idx) => {
                    let val = (savedData[r] && savedData[r].out[idx] !== undefined) ? savedData[r].out[idx] : ((defaultMockData[r] && defaultMockData[r].out[idx] !== undefined) ? defaultMockData[r].out[idx] : "0");
                    tdHtml += `<td class="border-r border-slate-200 p-1"><input type="text" data-type="out" data-idx="${idx}" value="${val}" class="custom-input font-mono text-green-700 font-bold bg-green-50/20" onchange="generateTable()"></td>`;
                });
                currentConfig.outputs.forEach((cfg, idx) => { tdHtml += `<td id="actual_r${r}_c${idx}" class="border-r border-slate-200 p-2 text-center font-mono text-slate-400 bg-slate-50/50 text-[18px]">-</td>`; });
                tdHtml += `<td id="status_r${r}" class="p-2 text-center text-slate-400 bg-slate-50/50 w-24 text-[18px]">-</td>`;
                tr.innerHTML = tdHtml;
                tbody.appendChild(tr);
            }
            
            const summaryEl = document.getElementById('gradingSummary');
            if(summaryEl) summaryEl.classList.add('hidden');
            applyLockState(); 
        }

        function log(message, type = 'info') {
            const consoleDiv = document.getElementById('consoleLog');
            if (!consoleDiv) return;
            const entry = document.createElement('div');
            if (type === 'error') entry.className = `log-entry text-red-400`;
            else if (type === 'success') entry.className = `log-entry text-emerald-400`;
            else if (type === 'warn') entry.className = `log-entry text-yellow-400`;
            else entry.className = `log-entry text-slate-300`;
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            entry.innerText = `[${time}] ${message}`;
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            const statusEl = document.getElementById('statusText');
            if(statusEl) statusEl.innerText = message.length > 30 ? message.substring(0, 30) + '...' : message;
        }

        function resolveConstructor(moduleExport, name) {
            if (!moduleExport) return null;
            if (typeof moduleExport === 'function') return moduleExport;
            if (moduleExport.default) {
                if (typeof moduleExport.default === 'function') return moduleExport.default;
                if (typeof moduleExport.default === 'object' && moduleExport.default.default && typeof moduleExport.default.default === 'function') return moduleExport.default.default;
            }
            if (name && moduleExport[name] && typeof moduleExport[name] === 'function') return moduleExport[name];
            return null;
        }

        // 啟動 Scratch 虛擬機 (終極防護版)
        function initVM() {
            try {
                if (typeof window.VirtualMachine === 'undefined') throw new Error('Scratch VM 未定義。');
                const VMClass = resolveConstructor(window.VirtualMachine, 'VirtualMachine');
                vm = new VMClass();
                vm.setTurboMode(true);
                
                if (typeof window.ScratchStorage !== 'undefined') {
                    const StorageClass = resolveConstructor(window.ScratchStorage, 'ScratchStorage');
                    if (StorageClass) {
                        storage = new StorageClass();
                        storage.projectHost = "https://projects.scratch.mit.edu/";
                        storage.assetHost = "https://assets.scratch.mit.edu/";
                        vm.attachStorage(storage);
                        
                        // 只要求圖片素材從官方伺服器下載
                        storage.addWebSource(
                            [storage.AssetType.ImageVector, storage.AssetType.ImageBitmap],
                            asset => `https://assets.scratch.mit.edu/internalapi/asset/${asset.assetId}.${asset.dataFormat}/get/`
                        );
                        
                        // ==========================================
                        // 【終極防卡死機制】：攔截底層素材載入請求
                        // ==========================================
                        const originalLoad = storage.load.bind(storage);
                        storage.load = async function(assetType, assetId, dataFormat) {
                            
                            // 1. 完全封殺音效下載！只要是聲音，一律回傳 null。
                            // 這是防止 HTTPS GitHub Pages 觸發瀏覽器 AudioContext 嚴格政策導致虛擬機死鎖的關鍵。
                            if (assetType === storage.AssetType.Sound) {
                                return null; 
                            }
                            
                            // 2. 對於圖片等其他素材，加上「5 秒強制超時」。
                            // 如果網路卡住，5 秒後會強迫放棄該圖片，讓虛擬機繼續載入專案本體（這對評量變數邏輯毫無影響）。
                            try {
                                const loadPromise = originalLoad(assetType, assetId, dataFormat);
                                const timeoutPromise = new Promise(resolve => setTimeout(() => resolve(null), 5000));
                                return await Promise.race([loadPromise, timeoutPromise]);
                            } catch (e) {
                                return null; // 載入失敗就跳過
                            }
                        };
                    }
                }

                // 【重要】完全不掛載 ScratchAudio Engine！從根源切斷解碼器卡死的問題。

                const canvas = document.getElementById('scratch-stage');
                if (typeof window.ScratchRender !== 'undefined') {
                    const RenderClass = resolveConstructor(window.ScratchRender, 'ScratchRender');
                    if (RenderClass) { renderer = new RenderClass(canvas); vm.attachRenderer(renderer); }
                }

                if (typeof window.ScratchSVGRenderer !== 'undefined') {
                    const SvgObj = window.ScratchSVGRenderer;
                    let SVGRendererClass = typeof SvgObj === 'function' ? SvgObj : (SvgObj.SVGRenderer || SvgObj.default);
                    let BitmapAdapterClass = typeof SvgObj === 'function' ? SvgObj.BitmapAdapter : (SvgObj.BitmapAdapter || (SvgObj.default && SvgObj.default.BitmapAdapter));
                    if (SVGRendererClass) vm.attachV2SVGAdapter(new SVGRendererClass());
                    if (BitmapAdapterClass) vm.attachV2BitmapAdapter(new BitmapAdapterClass());
                }

                // 攔截詢問方塊，自動填入解答
                vm.runtime.on('QUESTION', (question) => {
                    if (question !== null) {
                        let answer = "";
                        if (window.testInputQueue && window.testInputQueue.length > 0) {
                            answer = window.testInputQueue.shift();
                            log(`[VM 事件] 自動回答: ${answer}`);
                        }
                        setTimeout(() => vm.runtime.emit('ANSWER', String(answer)), 30);
                    }
                });

                vm.on('error', e => log(`VM Error: ${e}`, 'error'));
                vm.start();
                log('VM 核心啟動完成。', 'success');

            } catch (e) {
                log('系統初始化失敗: ' + e.message, 'error');
            }
        }

        function getProjectId(urlOrId) {
            const match = urlOrId.match(/projects\/(\d+)/);
            if (match) return match[1];
            if (/^\d+$/.test(urlOrId)) return urlOrId;
            return null;
        }

        async function loadProject() {
            const input = document.getElementById('projectUrl').value.trim();
            const projectId = getProjectId(input);
            const loadBtn = document.getElementById('loadBtn');
            const projectTitle = document.getElementById('projectTitle');
            const runBtn = document.getElementById('runBtn');

            if (!projectId) { log('無效的專案連結', 'error'); return false; }
            if (!vm) { log('VM 尚未準備好', 'error'); return false; }

            loadBtn.disabled = true;
            loadBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            runBtn.disabled = true;
            
            if (isProjectLoaded) { vm.stopAll(); vm.clear(); isProjectLoaded = false; }
            
            try {
                log(`獲取專案資訊: ${projectId}...`);
                let metadata = {};
                try {
                    // 使用 Turbowarp API 獲取 Metadata 以避開嚴格的 CORS 限制
                    const metaResp = await fetch(`https://trampoline.turbowarp.org/proxy/projects/${projectId}`);
                    if (metaResp.ok) metadata = await metaResp.json();
                } catch(e) {}
                
                let pTitle = metadata.title || `專案 ID: ${projectId}`;
                let pAuthor = metadata.author ? metadata.author.username : '未知';
                let pDateStr = '未知日期';
                if (metadata.history) {
                    let d = new Date(metadata.history.shared || metadata.history.modified || metadata.history.created);
                    if (!isNaN(d.getTime())) {
                        pDateStr = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}時${String(d.getMinutes()).padStart(2, '0')}分${String(d.getSeconds()).padStart(2, '0')}秒`;
                    }
                }
                projectTitle.innerText = `作者: ${pAuthor} | 專案: ${pTitle} | 日期: ${pDateStr}`;
                projectTitle.title = projectTitle.innerText; 
                
                log(`下載專案內容...`);
                let projectBuffer = null;
                const urls = [
                    metadata.project_token ? `https://projects.scratch.mit.edu/${projectId}?token=${metadata.project_token}` : null,
                    `https://projects.scratch.mit.edu/${projectId}`,
                    `https://trampoline.turbowarp.org/proxy/projects/${projectId}`
                ].filter(Boolean);

                for (const url of urls) {
                    try {
                        const resp = await fetch(url);
                        if (resp.ok) { projectBuffer = await resp.arrayBuffer(); break; }
                    } catch(err) {}
                }
                
                if (!projectBuffer) throw new Error('專案下載失敗，請確認是否公開或 ID 錯誤。');
                
                try {
                    log(`正在將專案載入虛擬機...`);
                    
                    // 虛擬機載入 (有了我們上面的音效攔截與圖片超時設計，這裡絕對不會卡死了)
                    const loadPromise = vm.loadProject(projectBuffer);
                    const timeoutPromise = new Promise((_, reject) => {
                        setTimeout(() => reject(new Error("虛擬機載入超時 (異常狀態)")), 15000);
                    });
                    
                    await Promise.race([loadPromise, timeoutPromise]);
                    vm.setTurboMode(true);
                    
                    isProjectLoaded = true;
                    runBtn.disabled = false; 
                    log(`專案 [${metadata.title || projectId}] 載入成功！`, 'success');
                    return true;
                } catch (vmError) {
                    throw new Error(`虛擬機處理異常: ${vmError.message}`);
                }

            } catch (e) {
                log(`載入失敗: ${(e && e.message) ? e.message : "未知錯誤"}`, 'error');
                console.error("專案載入詳細錯誤:", e);
                projectTitle.innerText = '載入失敗';
                return false;
            } finally {
                loadBtn.disabled = false;
                loadBtn.innerHTML = '<span>載入</span>';
            }
        }

        // 強制注入 Scratch 變數
        function injectVariables(inputValues) {
            if (vm && vm.runtime && vm.runtime.targets) {
                vm.runtime.targets.forEach(target => {
                    for (const id in target.variables) {
                        const v = target.variables[id];
                        if (v.type === '') {
                            const matchedInput = currentConfig.inputs.find(cfg => cfg.name === v.name);
                            if (matchedInput) { v.value = inputValues[currentConfig.inputs.indexOf(matchedInput)]; }
                        }
                    }
                });
            }
        }

        // 讀取 Scratch 變數結果
        function extractVariables() {
            let results = new Array(currentConfig.outputs.length).fill("");
            if (vm && vm.runtime && vm.runtime.targets) {
                vm.runtime.targets.forEach(target => {
                    for (const id in target.variables) {
                        const v = target.variables[id];
                        if (v.type === '') {
                            const matchedOutput = currentConfig.outputs.find(cfg => cfg.name === v.name);
                            if (matchedOutput) { results[currentConfig.outputs.indexOf(matchedOutput)] = v.value; }
                        }
                    }
                });
            }
            return results;
        }

        function runSingleTest(inputValues) {
            return new Promise((resolve) => {
                window.testInputQueue = [...inputValues];
                vm.stopAll();
                vm.greenFlag();
                let injectTicks = 0;
                const interval = setInterval(() => {
                    injectVariables(inputValues);
                    injectTicks++;
                    if (injectTicks > 10) clearInterval(interval); 
                }, 30);
                setTimeout(() => { resolve(extractVariables()); }, 1500);
            });
        }
        
        function compareValuesWithMode(expected, actual, mode) {
            const expStr = String(expected).trim();
            const actStr = String(actual).trim();
            if (expStr === actStr) return true;
            
            const expNum = parseFloat(expStr);
            let actNum = parseFloat(actStr);
            if (mode === 'text' || isNaN(expNum) || isNaN(actNum)) return false; 
            
            if (mode === 'round0') actNum = Math.round(actNum);
            else if (mode === 'round1') actNum = Math.round(actNum * 10) / 10;
            else if (mode === 'round2') actNum = Math.round(actNum * 100) / 100;
            
            return Math.abs(expNum - actNum) <= 0.001;
        }

        async function runBatchTest() {
            const runBtn = document.getElementById('runBtn');
            const originalBtnText = runBtn.innerHTML;
            if (!isProjectLoaded) { if (!(await loadProject())) return; }

            runBtn.disabled = true;
            runBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 評分執行中...';
            
            try {
                const rows = document.querySelectorAll('#testDataBody tr');
                for(let r = 0; r < rows.length; r++) {
                    document.getElementById(`status_r${r}`).innerHTML = '<i class="fa-solid fa-spinner fa-spin text-indigo-400"></i>';
                    currentConfig.outputs.forEach((c, idx) => {
                        const cell = document.getElementById(`actual_r${r}_c${idx}`);
                        cell.innerHTML = '執行中..';
                        cell.className = "border-r border-slate-200 p-2 text-center font-mono text-indigo-400 bg-indigo-50/30 text-[18px]";
                    });
                }

                log(`--- 開始自動評分 (共 ${rows.length} 筆) ---`, 'info');
                let totalScore = 0;

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    const inInputs = Array.from(row.querySelectorAll('input[data-type="in"]')).map(el => el.value);
                    const expectedOutputs = Array.from(row.querySelectorAll('input[data-type="out"]')).map(el => el.value);
                    
                    log(`[測試 ${i+1}] 測試執行中...`);
                    const scratchOutputs = await runSingleTest(inInputs);
                    let rowScore = 0;
                    
                    for (let j = 0; j < expectedOutputs.length; j++) {
                        const isMatch = compareValuesWithMode(expectedOutputs[j], scratchOutputs[j], currentConfig.outputs[j].mode);
                        if (isMatch) rowScore += 10;
                        
                        let actualDisplay = scratchOutputs[j];
                        if (!isNaN(parseFloat(actualDisplay)) && String(actualDisplay).includes('.')) {
                             actualDisplay = Number(parseFloat(actualDisplay).toFixed(5)).toString();
                        }
                        
                        const actualCell = document.getElementById(`actual_r${i}_c${j}`);
                        actualCell.innerHTML = actualDisplay;
                        actualCell.className = isMatch ? "border-r border-slate-200 p-2 text-center font-mono text-green-700 bg-green-50 font-bold text-[18px]" : "border-r border-slate-200 p-2 text-center font-mono text-red-600 bg-red-50 font-bold text-[18px]";
                    }
                    
                    totalScore += rowScore;
                    const statusCell = document.getElementById(`status_r${i}`);
                    
                    if (rowScore === expectedOutputs.length * 10) {
                        statusCell.innerHTML = `<span class="bg-green-100 text-green-700 px-3 py-1.5 rounded-full font-bold border border-green-200 shadow-sm">${rowScore}分</span>`;
                        statusCell.className = "p-2 text-center bg-green-50/30 text-[18px]";
                    } else if (rowScore > 0) {
                        statusCell.innerHTML = `<span class="bg-amber-100 text-amber-700 px-3 py-1.5 rounded-full font-bold border border-amber-200 shadow-sm">${rowScore}分</span>`;
                        statusCell.className = "p-2 text-center bg-amber-50/30 text-[18px]";
                    } else {
                        statusCell.innerHTML = `<span class="bg-red-100 text-red-700 px-3 py-1.5 rounded-full font-bold border border-red-200 shadow-sm">0分</span>`;
                        statusCell.className = "p-2 text-center bg-red-50/30 text-[18px]";
                    }
                }

                const now = new Date();
                document.getElementById('gradingTime').innerText = `評分時間：${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${String(now.getHours()).padStart(2, '0')}時${String(now.getMinutes()).padStart(2, '0')}分${String(now.getSeconds()).padStart(2, '0')}秒`;
                document.getElementById('gradingTotalScore').innerHTML = `總分：<span class="text-[42px] text-red-600 mx-2">${totalScore}</span> 分`;
                document.getElementById('gradingSummary').classList.remove('hidden');

                log(`評分執行完畢，最終得分：${totalScore} 分`, 'info');

            } catch (err) {
                console.error(err);
                log('執行批次時發生例外錯誤。', 'error');
            } finally {
                runBtn.disabled = false;
                runBtn.innerHTML = originalBtnText;
            }
        }
    </script>
